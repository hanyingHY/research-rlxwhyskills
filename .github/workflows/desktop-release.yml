name: Release desktop builds

# Push a tag that matches the app version, for example:
#   npm pkg get version   -> 0.1.4
#   git tag v0.1.4 && git push origin v0.1.4
#
# Each job builds one OS/arch pair on its own runner, bundles a relocatable
# Python, the OpenDirector wheel for that platform, FFmpeg and the preload
# bundle, then uploads the installer plus latest*.yml update metadata to the
# GitHub release. A final job publishes the draft release.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      upstream_ref:
        description: Upstream OpenDirector tag to bundle (defaults to v<app version>)
        required: false
      publish:
        description: Publish a draft release instead of only building artifacts
        type: boolean
        default: false

permissions:
  contents: write

env:
  NODE_VERSION: "24.22.1"
  PYTHON_VERSION: "3.12"

jobs:
  verify:
    name: Verify version and contract
    runs-on: ubuntu-22.04
    defaults:
      run:
        working-directory: opendirector-desktop
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: opendirector-desktop/package-lock.json
      - run: npm ci --ignore-scripts
      - run: npm run build:preload
      - run: npm test
      - name: Tag matches package version
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          version="$(node -p "require('./package.json').version")"
          test "v${version}" = "${GITHUB_REF_NAME}" || {
            echo "Tag ${GITHUB_REF_NAME} does not match package version ${version}"; exit 1; }

  build:
    name: Build ${{ matrix.target }}
    needs: verify
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: opendirector-desktop
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            target: linux-x64
            build: --linux --x64
          - os: ubuntu-24.04-arm
            target: linux-arm64
            build: --linux --arm64
          - os: macos-15-intel
            target: mac-x64
            build: --mac --x64
          - os: macos-14
            target: mac-arm64
            build: --mac --arm64
          - os: windows-2022
            target: win-x64
            build: --win --x64
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: opendirector-desktop/package-lock.json

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Resolve upstream ref
        id: ref
        shell: bash
        run: |
          version="$(node -p "require('./package.json').version")"
          ref="${{ inputs.upstream_ref }}"
          echo "ref=${ref:-v${version}}" >> "$GITHUB_OUTPUT"

      # The Python wheel bundles the web UI, skills and the agent binary, so the
      # upstream checkout must build with Node and npm available.
      - name: Check out upstream sources
        uses: actions/checkout@v4
        with:
          repository: ThinkFlowLab/OpenDirector
          ref: ${{ steps.ref.outputs.ref }}
          path: upstream

      - name: Build the OpenDirector wheel set
        shell: bash
        working-directory: ${{ github.workspace }}
        run: |
          python -m pip install --upgrade pip wheel
          cd upstream
          npm ci
          python -m pip wheel . -w "$GITHUB_WORKSPACE/opendirector-desktop/runtime/wheels"
          ls -1 "$GITHUB_WORKSPACE/opendirector-desktop/runtime/wheels" | head -30

      - run: npm ci

      - name: Fetch relocatable Python
        run: node scripts/fetch-python.mjs --target ${{ matrix.target }}

      - name: Fetch FFmpeg
        run: node scripts/fetch-ffmpeg.mjs --target ${{ matrix.target }}

      - name: Assemble runtime
        run: node scripts/prepare-runtime.mjs --target ${{ matrix.target }} --ffmpeg runtime/dist/.ffmpeg/${{ matrix.target }}-bin

      - run: npm run build:preload

      - name: Package and upload
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Unsigned builds: skip certificate discovery instead of failing.
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
        run: |
          npx electron-builder ${{ matrix.build }} --publish always \
            --config.publish.owner=${{ github.repository_owner }} \
            --config.publish.repo=${{ github.event.repository.name }}

      - uses: actions/upload-artifact@v4
        with:
          name: OpenDirector-${{ matrix.target }}
          path: |
            opendirector-desktop/release/*.dmg
            opendirector-desktop/release/*.zip
            opendirector-desktop/release/*.exe
            opendirector-desktop/release/*.AppImage
            opendirector-desktop/release/*.deb
            opendirector-desktop/release/*.rpm
            opendirector-desktop/release/latest*.yml
          if-no-files-found: error

  publish:
    name: Publish the release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v') || inputs.publish
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - name: Undraft the release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          tag="${GITHUB_REF_NAME}"
          if [ "${GITHUB_REF_TYPE}" != "tag" ]; then
            tag="v$(node -p "require('./opendirector-desktop/package.json').version")"
          fi
          gh release edit "$tag" --draft=false --latest
